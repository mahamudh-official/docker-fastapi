name: CI

on:
  push:
  
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "CI is working"
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t docker-fastapi:v1 .
        
      - name: Tag Docker image
        run: docker tag docker-fastapi:v1 ghcr.io/mahamudh-official/docker-fastapi:v1

      - name: Push Docker image
        run: docker push ghcr.io/mahamudh-official/docker-fastapi:v1
